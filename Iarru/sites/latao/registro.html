<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Latão aéreo - Registro</title>

</head>
<header class="cabecalho">
   
  <a class="logo" href="#">Latão aéreo</a>

   <a class="link" href="lataoHTML.html">Home</a>
    
</header>
<body class="body">
    <section class="pesquisa">
    <h2>Encontre as melhores ofertas de passagens aéreas</h2>
      <div class="pesquisainput">
        <label>nome:</label>
        <input type="text" placeholder="digite seu nome" />
      </div>

        <div class="pesquisainput">
        <label>numero:</label>
        <input type="phone" placeholder="digite seu numero" />
      </div>

        <div class="pesquisainput">
        <label>email:</label>
        <input type="email" placeholder="ex:seuemail@dominio.com" />
        </div>

        <div class="pesquisainput">
        <label>senha:</label>
        <input type="password" placeholder="digite sua senha" />
        </div>

      <div class="pesquisainput">
        <label>data de nascimento:</label>
        <input type="date"/>
      </div>

    </div>
      <button>Salvar</button>
  </section>
</body>
</html>
